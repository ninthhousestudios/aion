# --- Cycle prevention for emergent hubs ---

[[constraint]]
kind = "no_cycles"
scope = "lib/theme/"
name = "theme-no-cycles"
severity = "blocking"
provenance = "checkpoint:aion/81"

[[constraint]]
kind = "no_cycles"
scope = "lib/canvas/"
name = "canvas-no-cycles"
severity = "blocking"
provenance = "checkpoint:aion/81"

[[constraint]]
kind = "no_cycles"
scope = "lib/renderer/"
name = "renderer-no-cycles"
severity = "blocking"
provenance = "checkpoint:aion/81"

# --- Language catalog: coding_discipline [enforced] ---
# Tree-sitter-dart grammar node names need validation before these go live.
# Catalog queries (vidhi/language-rules/dart.toml) failed parse against the
# actual grammar. Uncomment and fix queries when grammar is investigated.
#
# TRIGGER: tree-sitter-dart grammar investigation
# no-dynamic-type: forbidden_pattern, advisory, scope lib/
#   Detects `dynamic` type usage. Catalog query:
#   '(type_identifier) @m (#eq? @m "dynamic") @match'
#
# no-bang-null-assertion: forbidden_pattern, advisory, scope lib/
#   Detects `!` null assertions. Catalog query:
#   '(postfix_expression operator: "!") @match'

